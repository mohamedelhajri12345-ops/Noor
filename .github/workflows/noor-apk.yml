name: Noor APK - Clean Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: noor-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Noor Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Noor repository
        uses: actions/checkout@v4

      - name: Checkout open-source Flutter base
        uses: actions/checkout@v4
        with:
          repository: mo7amedaliEbaid/islamic
          ref: master
          path: islamic-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.10.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          cache: true

      - name: Apply Noor sources
        shell: bash
        run: |
          set -euo pipefail
          test -f noor_src/main.dart
          test -f noor_src/audio_service.dart
          test -f noor_src/patch_audio.py
          test -f noor_src/android/MainActivity.kt
          test -f noor_src/android/NativeBridge.kt
          cp noor_src/main.dart islamic-base/lib/main.dart
          cp noor_src/audio_service.dart islamic-base/lib/audio_service.dart
          python3 noor_src/patch_audio.py
          mkdir -p islamic-base/android/app/src/main/kotlin/com/example/islamic
          cp noor_src/android/MainActivity.kt islamic-base/android/app/src/main/kotlin/com/example/islamic/MainActivity.kt
          cp noor_src/android/NativeBridge.kt islamic-base/android/app/src/main/kotlin/com/example/islamic/NativeBridge.kt

      - name: Configure Noor package and permissions
        working-directory: islamic-base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('name: islamic', 'name: noor', 1)
          s = s.replace('description: A new Flutter project.', 'description: Noor - Premium Islamic companion', 1)
          p.write_text(s)
          for root in ('lib', 'test'):
              d = Path(root)
              if d.exists():
                  for f in d.rglob('*.dart'):
                      f.write_text(f.read_text().replace('package:islamic/', 'package:noor/'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              s = manifest.read_text()
              s = s.replace('android:label="islamic"', 'android:label="Noor"')
              if 'android.permission.POST_NOTIFICATIONS' not in s:
                  s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
              manifest.write_text(s)
          gradle = Path('android/app/build.gradle')
          if gradle.exists():
              s = gradle.read_text()
              import re
              s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.noorpromax"', s, count=1)
              gradle.write_text(s)
          kts = Path('android/app/build.gradle.kts')
          if kts.exists():
              s = kts.read_text()
              import re
              s = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "com.noorpromax"', s, count=1)
              kts.write_text(s)
          PY

      - name: Get Flutter dependencies
        working-directory: islamic-base
        run: flutter pub get

      - name: Analyze Noor
        working-directory: islamic-base
        run: flutter analyze lib/main.dart lib/audio_service.dart --no-fatal-infos

      - name: Build signed-by-debug Release APK
        working-directory: islamic-base
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s islamic-base/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp islamic-base/build/app/outputs/flutter-apk/app-release.apk dist/Noor-release.apk
          ls -lh dist/Noor-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK-Release
          path: dist/Noor-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
