name: Noor Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Noor
        uses: actions/checkout@v4
      - name: Checkout Islamic open-source base
        uses: actions/checkout@v4
        with:
          repository: mo7amedaliEbaid/islamic
          ref: master
          path: islamic-base
          fetch-depth: 1
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          cache: true
      - name: Configure Noor
        working-directory: islamic-base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text().replace('name: islamic','name: noor').replace('description: A new Flutter project.','description: Noor - Premium Islamic companion')
          p.write_text(s)
          for root in ['lib','test']:
            d=Path(root)
            if d.exists():
              for f in d.rglob('*.dart'):
                f.write_text(f.read_text().replace('package:islamic/','package:noor/'))
          PY
          if [ -f android/app/build.gradle ]; then sed -i 's/applicationId "[^"]*"/applicationId "com.noorpromax"/' android/app/build.gradle || true; fi
          if [ -f android/app/build.gradle.kts ]; then sed -i 's/applicationId = "[^"]*"/applicationId = "com.noorpromax"/' android/app/build.gradle.kts || true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then sed -i 's/android:label="[^"]*"/android:label="Noor"/' android/app/src/main/AndroidManifest.xml || true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          if 'POST_NOTIFICATIONS' not in s: s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
          p.write_text(s)
          PY
          fi
      - name: Install Noor Dart application and audio bridge
        run: |
          cp noor_src/main.dart islamic-base/lib/main.dart
          cp noor_src/audio_service.dart islamic-base/lib/audio_service.dart
          python3 noor_src/patch_audio.py
          mkdir -p islamic-base/android/app/src/main/kotlin/com/example/islamic
          cp noor_src/android/MainActivity.kt islamic-base/android/app/src/main/kotlin/com/example/islamic/MainActivity.kt
          cp noor_src/android/NativeBridge.kt islamic-base/android/app/src/main/kotlin/com/example/islamic/NativeBridge.kt
      - name: Resolve dependencies
        working-directory: islamic-base
        run: flutter pub get
      - name: Analyze
        working-directory: islamic-base
        run: flutter analyze lib/main.dart lib/audio_service.dart --no-fatal-infos
      - name: Build release APK
        working-directory: islamic-base
        run: flutter build apk --release
      - name: Package APK
        run: |
          mkdir -p dist
          cp islamic-base/build/app/outputs/flutter-apk/app-release.apk dist/Noor-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Android-Release
          path: dist/Noor-release.apk
          if-no-files-found: error
