name: Noor Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Noor
        uses: actions/checkout@v4

      - name: Checkout Islamic open-source base
        uses: actions/checkout@v4
        with:
          repository: mo7amedaliEbaid/islamic
          ref: master
          path: islamic-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          cache: true

      - name: Configure Noor identity and Android package
        working-directory: islamic-base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          s=p.read_text().replace('name: islamic','name: noor').replace('description: A new Flutter project.','description: Noor - Premium Islamic companion')
          p.write_text(s)
          for root in ['lib','test']:
            d=Path(root)
            if d.exists():
              for f in d.rglob('*.dart'):
                s=f.read_text().replace('package:islamic/','package:noor/')
                f.write_text(s)
          PY
          if [ -f android/app/build.gradle ]; then sed -i 's/applicationId "[^"]*"/applicationId "com.noorpromax"/' android/app/build.gradle || true; fi
          if [ -f android/app/build.gradle.kts ]; then sed -i 's/applicationId = "[^"]*"/applicationId = "com.noorpromax"/' android/app/build.gradle.kts || true; fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then sed -i 's/android:label="[^"]*"/android:label="Noor"/' android/app/src/main/AndroidManifest.xml || true; fi

      - name: Install Noor visual foundation
        working-directory: islamic-base
        shell: bash
        run: |
          cat > lib/noor_theme.dart <<'DART'
          import 'package:flutter/material.dart';
          class NoorColors {
            static const olive = Color(0xFF4E5635);
            static const oliveDark = Color(0xFF252B1B);
            static const crimson = Color(0xFF8D2436);
            static const silver = Color(0xFFB9BEC6);
            static const ivory = Color(0xFFF6F2E8);
          }
          ThemeData noorTheme(Brightness brightness) {
            final dark = brightness == Brightness.dark;
            final base = ThemeData(brightness: brightness, useMaterial3: true);
            return base.copyWith(
              scaffoldBackgroundColor: dark ? NoorColors.oliveDark : NoorColors.ivory,
              colorScheme: ColorScheme.fromSeed(seedColor: NoorColors.olive, brightness: brightness).copyWith(secondary: NoorColors.crimson),
              appBarTheme: AppBarTheme(centerTitle: true, elevation: 0, backgroundColor: dark ? NoorColors.oliveDark : NoorColors.ivory, foregroundColor: dark ? Colors.white : NoorColors.oliveDark),
              cardTheme: CardThemeData(elevation: 1, margin: const EdgeInsets.all(8), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(22))),
            );
          }
          DART
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/core/app.dart')
          s=p.read_text()
          if "import '../noor_theme.dart';" not in s:
            s=s.replace("import '../app/resources/resources.dart';", "import '../app/resources/resources.dart';\nimport '../noor_theme.dart';")
          s=s.replace('darkTheme: getApplicationLDarkTheme(),', 'darkTheme: noorTheme(Brightness.dark),')
          s=s.replace('theme: getApplicationLightTheme(),', 'theme: noorTheme(Brightness.light),')
          p.write_text(s)
          PY

      - name: Resolve dependencies
        working-directory: islamic-base
        run: flutter pub get

      - name: Analyze
        working-directory: islamic-base
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Noor release APK
        working-directory: islamic-base
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp islamic-base/build/app/outputs/flutter-apk/app-release.apk dist/Noor-release.apk

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Android-Release
          path: dist/Noor-release.apk
          if-no-files-found: error
