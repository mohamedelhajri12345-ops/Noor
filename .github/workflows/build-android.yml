name: Noor Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Noor
        uses: actions/checkout@v4

      - name: Checkout open-source Islamic base
        uses: actions/checkout@v4
        with:
          repository: mo7amedaliEbaid/islamic
          ref: master
          path: islamic-base
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Configure Noor identity
        working-directory: islamic-base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('name: islamic', 'name: noor')
          s = s.replace('description: A new Flutter project.', 'description: Noor - Islamic companion for Android and iOS.')
          s = s.replace('version: 1.0.0+1', 'version: 1.0.0+1')
          p.write_text(s)
          PY
          if [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId \"[^\"]*\"/applicationId \"com.noorpromax\"/" android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.noorpromax"/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="[^"]*"/android:label="Noor"/' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Resolve dependencies
        working-directory: islamic-base
        run: flutter pub get

      - name: Analyze project
        working-directory: islamic-base
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Noor APK
        working-directory: islamic-base
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp islamic-base/build/app/outputs/flutter-apk/app-release.apk dist/Noor-release.apk

      - name: Upload Noor APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Android-APK
          path: dist/Noor-release.apk
          if-no-files-found: error
